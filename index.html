<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <title>Secure Video Access | Ready to Stream</title>
    
    <meta name="description" content="Your verified video content is ready. You will be automatically redirected to the secure media player.">
    <meta name="robots" content="index, follow">
    
    <meta property="og:site_name" content="Secure Video Portal">
    <meta property="og:title" content="Video Ready to Play">
    <meta property="og:description" content="Your verified video content is ready. Tap to proceed to the secure media player.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://videynow.pages.dev/">
    <meta property="og:image" content="https://videynow.pages.dev/og-image.jpg">
    
    <style>
        :root {
            --bg-color: #09090b;
            --card-bg: #18181b;
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #22c55e;
            --primary-hover: #16a34a;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at 50% 0%, #1c1c22 0%, var(--bg-color) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            line-height: 1.5;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 32px 24px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(34, 197, 94, 0.1);
            color: #4ade80;
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 24px;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }

        .video-mockup {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 16px;
            position: relative;
            overflow: hidden;
            margin-bottom: 24px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .video-mockup:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .video-skeleton {
            width: 100%;
            height: 100%;
            background: linear-gradient(110deg, #0f0f10 8%, #1a1a1e 18%, #0f0f10 33%);
            background-size: 200% 100%;
            animation: shimmer 1.5s linear infinite;
        }

        @keyframes shimmer {
            to { background-position-x: -200%; }
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            transition: transform 0.2s ease, background 0.2s ease;
            z-index: 10;
        }

        .video-mockup:hover .play-button {
            transform: translate(-50%, -50%) scale(1.1);
            background: #ffffff;
        }

        .play-button svg {
            width: 28px;
            height: 28px;
            color: #000;
            margin-left: 4px;
        }

        .pulse-ring {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.5);
            animation: pulse 2s infinite;
            z-index: 5;
            pointer-events: none;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--text-main);
            letter-spacing: -0.5px;
        }

        p.description {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .countdown-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 12px;
            margin-bottom: 24px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
        }

        .countdown-number {
            color: var(--primary);
            font-size: 18px;
            font-weight: 800;
            min-width: 24px;
            text-align: center;
        }

        .btn-primary {
            width: 100%;
            border: none;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            color: #ffffff;
            padding: 18px 24px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 17px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(22, 163, 94, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.6s;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(22, 163, 94, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .video-id {
            margin-top: 24px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.25);
            font-family: "SF Mono", Monaco, monospace;
            word-break: break-all;
            background: rgba(255, 255, 255, 0.03);
            padding: 8px 12px;
            border-radius: 8px;
            display: inline-block;
        }

        footer {
            margin-top: 32px;
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.35);
        }

        footer a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            transition: color 0.2s;
        }

        footer a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        .separator {
            margin: 0 8px;
        }

        .copyright {
            margin-top: 12px;
            font-size: 11px;
            color: rgba(255, 255, 255, 0.2);
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .animate-spin {
            animation: spin 1s linear infinite;
        }

        @media (max-width: 480px) {
            .card {
                padding: 28px 20px;
                border-radius: 20px;
            }
            h1 {
                font-size: 22px;
            }
            .play-button {
                width: 56px;
                height: 56px;
            }
            .play-button svg {
                width: 24px;
                height: 24px;
            }
            .pulse-ring {
                width: 56px;
                height: 56px;
            }
        }
    </style>
</head>
<body>

    <main class="card">
        <div class="badge">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
            </svg>
            SSL Secured & Verified
        </div>

        <div class="video-mockup" id="videoMockup" role="button" aria-label="Play Video">
            <div class="video-skeleton"></div>
            <div class="pulse-ring" id="pulseRing"></div>
            <div class="play-button">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                    <path d="M8 5v14l11-7z"/>
                </svg>
            </div>
        </div>
        
        <h1>Video Ready to Stream</h1>
        <p class="description">Your content has been verified. You will be automatically redirected to the secure media player.</p>

        <div class="countdown-badge">
            <span>Redirecting in</span>
            <span class="countdown-number" id="countdownNumber">3</span>
            <span>seconds</span>
        </div>

        <button id="continueBtn" class="btn-primary" aria-label="Continue to Video Now">
            <span id="btnText">Continue to Video Now</span>
            <svg id="btnIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M5 12h14"/>
                <path d="m12 5 7 7-7 7"/>
            </svg>
        </button>

        <div class="video-id" id="videoInfo" aria-live="polite"></div>
    </main>

    <footer>
        <nav aria-label="Footer Navigation">
            <a href="/privacy-policy" rel="noopener noreferrer">Privacy Policy</a>
            <span class="separator">•</span>
            <a href="/terms-of-service" rel="noopener noreferrer">Terms of Service</a>
            <span class="separator">•</span>
            <a href="/contact" rel="noopener noreferrer">Contact</a>
        </nav>
        <p class="copyright">© 2024 Secure Video Portal. All rights reserved.</p>
    </footer>

    <script>
        const DESTINATION_BASE = "https://mov.vidley.pw/";

        function getVideoId() {
            const params = new URLSearchParams(window.location.search);
            let id = params.get("id") || params.get("v") || params.get("video");

            if (!id) {
                const parts = window.location.pathname.split("/").filter(Boolean);
                if (parts.length) {
                    id = parts[parts.length - 1];
                }
            }

            if (!id) return "";

            id = id.replace(/\.(html|mp4|php)$/i, "").trim();

            if (!/^[a-zA-Z0-9_-]+$/.test(id)) {
                return "";
            }

            return id;
        }

        document.addEventListener("DOMContentLoaded", () => {
            const videoId = getVideoId();
            const videoInfoEl = document.getElementById("videoInfo");
            const continueBtn = document.getElementById("continueBtn");
            const videoMockup = document.getElementById("videoMockup");
            const countdownNumber = document.getElementById("countdownNumber");
            const pulseRing = document.getElementById("pulseRing");
            const btnText = document.getElementById("btnText");
            const btnIcon = document.getElementById("btnIcon");

            if (!videoId) {
                countdownNumber.parentElement.style.display = "none";
                videoInfoEl.textContent = "Session: Invalid";
                continueBtn.disabled = true;
                continueBtn.style.opacity = "0.5";
                continueBtn.style.cursor = "not-allowed";
                if (pulseRing) pulseRing.style.display = "none";
                return;
            }

            videoInfoEl.textContent = "Secure Session: " + videoId;
            
            const finalDestination = DESTINATION_BASE + encodeURIComponent(videoId);

            const sessionKey = "redirected_" + videoId;
            
            if (sessionStorage.getItem(sessionKey) === "true") {
                countdownNumber.parentElement.innerHTML = "<span style='color: #fbbf24;'>Already processed. Click below if the video does not start.</span>";
                if (pulseRing) pulseRing.style.display = "none";
            } else {
                let countdown = 3;
                countdownNumber.textContent = countdown;

                const redirectTimer = setInterval(() => {
                    countdown--;
                    if (countdown > 0) {
                        countdownNumber.textContent = countdown;
                    } else {
                        clearInterval(redirectTimer);
                        sessionStorage.setItem(sessionKey, "true");
                        window.location.href = finalDestination;
                    }
                }, 1000);
            }

            const handleManualRedirect = () => {
                sessionStorage.setItem("redirected_" + videoId, "true");
                continueBtn.disabled = true;
                if (pulseRing) pulseRing.style.display = "none";
                btnText.textContent = "Opening Player...";
                
                btnIcon.innerHTML = '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>';
                btnIcon.setAttribute("fill", "none");
                btnIcon.setAttribute("stroke", "currentColor");
                btnIcon.style.marginLeft = "0";
                btnIcon.classList.add("animate-spin");

                setTimeout(() => {
                    window.location.href = finalDestination;
                }, 300);
            };

            continueBtn.addEventListener("click", handleManualRedirect);
            videoMockup.addEventListener("click", handleManualRedirect);
        });
    </script>
</body>
</html>
